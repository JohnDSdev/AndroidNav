plugins {
    id 'com.android.application'
}

android {
    namespace 'com.johndsdev.androidnav'
    compileSdk 35

    signingConfigs {
        debugPersistent {
            storeFile file("$rootDir/signing/androidnav-debug.keystore")
            storePassword 'androidnav'
            keyAlias 'androidnav'
            keyPassword 'androidnav'
            v1SigningEnabled true
            v2SigningEnabled true
        }
    }

    defaultConfig {
        applicationId 'com.johndsdev.androidnav.navidrome'
        minSdk 23
        targetSdk 34
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        versionCode 8
        versionName '2.5.0'
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debugPersistent
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    androidTestImplementation 'androidx.test:runner:1.6.2'
}
