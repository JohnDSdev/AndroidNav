<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#000"><title>AndroidNav</title><style>
:root{color-scheme:dark;--fg:#f4f4f4;--muted:rgba(255,255,255,.66);--line:rgba(255,255,255,.18);--glass:rgba(255,255,255,.035);--dim:.28;--font:system-ui,-apple-system,"Segoe UI",sans-serif}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#050505;color:var(--fg);font-family:var(--font)}body{overflow-x:hidden}button,input{font:inherit;color:inherit}#wall{position:fixed;inset:0;z-index:0;background:#050505 radial-gradient(circle at 30% 20%,#fff 0 1px,transparent 1.2px);background-size:47px 47px;background-position:center;background-repeat:repeat}#wall:after{content:"";position:absolute;inset:0;background:rgba(0,0,0,var(--dim))}#app{position:relative;z-index:1;min-height:100vh;padding:calc(env(safe-area-inset-top) + 16px) 16px calc(env(safe-area-inset-bottom) + 96px)}.top{position:sticky;top:0;z-index:5;padding:6px 0 14px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}.searchrow{display:flex;gap:10px}.search,.icon,.btn,.sheet{border:1px solid var(--line);background:var(--glass);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}.search{flex:1;min-width:0;height:54px;border-radius:18px;display:flex;align-items:center;gap:12px;padding:0 16px}.search svg{width:21px;flex:0 0 auto}.search input{width:100%;min-width:0;background:transparent;border:0;outline:0;font-size:18px}.search input::placeholder{color:rgba(255,255,255,.78)}.icon{width:54px;height:54px;border-radius:18px;font-size:25px}.tabs{display:flex;gap:26px;margin:15px 4px 0}.tab{border:0;background:transparent;padding:7px 0;color:var(--muted);font-size:17px;position:relative}.tab.active{color:var(--fg)}.tab.active:after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:currentColor;border-radius:3px}.viewport{overflow:hidden}.track{display:flex;width:200%;transition:transform .22s ease}.page{width:50%;flex:0 0 50%;min-width:0;padding:12px 2px 0}.head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin:5px 0 14px}.title{font-size:clamp(34px,9vw,48px);font-weight:560;line-height:.98;letter-spacing:-.05em}.meta,.sub,.note{color:var(--muted)}.meta{font-size:13px;padding-top:8px;text-align:right}.note{font-size:14px;line-height:1.45;margin-top:8px;max-width:520px}.row,.playlist{display:flex;align-items:flex-start;gap:10px;padding:12px 2px 14px;border-bottom:1px solid rgba(255,255,255,.11)}.main{flex:1;min-width:0;border:0;background:transparent;text-align:left;padding:0}.rowtitle,.playlistname{font-size:23px;line-height:1.12;letter-spacing:-.025em;overflow-wrap:anywhere;word-break:break-word;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden}.sub{font-size:14px;line-height:1.35;margin-top:5px;overflow-wrap:anywhere}.empty{color:var(--muted);font-size:16px;line-height:1.55;padding:22px 2px}.btn{min-height:44px;border-radius:14px;padding:9px 14px}.small{width:42px;height:42px;border-radius:50%;padding:0;flex:0 0 auto}.now{position:fixed;z-index:8;left:16px;right:16px;bottom:calc(env(safe-area-inset-bottom) + 12px);display:none;align-items:center;gap:8px;padding:10px 8px 10px 14px;border:1px solid var(--line);border-radius:18px;background:rgba(255,255,255,.045);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}.now.show{display:flex}.nowcopy{flex:1;min-width:0}.nowtitle,.nowsub{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.nowsub{color:var(--muted);font-size:12px;margin-top:2px}.overlay{position:fixed;inset:0;z-index:20;display:none;align-items:flex-end;padding:16px;background:rgba(0,0,0,.25);backdrop-filter:blur(8px)}.overlay.show{display:flex}.sheet{width:100%;max-height:86vh;overflow:auto;border-radius:26px;padding:18px}.sheethead{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.sheettitle{font-size:28px;letter-spacing:-.04em}.setting{padding:14px 0;border-top:1px solid rgba(255,255,255,.12)}.setting:first-of-type{border-top:0}.setting label{display:block;font-size:16px;margin-bottom:6px}.desc{color:var(--muted);font-size:13px;line-height:1.4;margin-bottom:10px}.fields{display:grid;gap:9px}.fields input{width:100%;min-height:47px;border:1px solid var(--line);border-radius:14px;background:var(--glass);padding:0 13px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.hidden{display:none}.back{width:44px;height:44px;border-radius:14px;padding:0}.detailhead{display:flex;gap:9px;align-items:flex-start;margin-bottom:14px}@media(min-width:720px){#app{max-width:760px;margin:auto}.sheet{max-width:620px}.overlay{justify-content:center}}@media(prefers-reduced-motion:reduce){.track{transition:none}}
</style></head><body><div id="wall"></div><main id="app"><header class="top"><div class="searchrow"><label class="search"><svg viewBox="0 0 24 24"><path d="m21 21-4.4-4.4m2.1-5.4a7.5 7.5 0 1 1-15 0 7.5 7.5 0 0 1 15 0Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg><input id="q" type="search" placeholder="songs" autocomplete="off"></label><button id="settings" class="icon" type="button">☰</button></div><nav class="tabs"><button id="songsTab" class="tab active" type="button">songs</button><button id="listsTab" class="tab" type="button">playlists</button></nav></header><div id="viewport" class="viewport"><div id="track" class="track"><section class="page"><div class="head"><div><div class="title">Songs</div><div id="note" class="note"></div></div><div id="songCount" class="meta"></div></div><div id="songs"></div></section><section class="page"><div id="playlists"></div></section></div></div></main><div id="now" class="now"><div class="nowcopy"><div id="nowTitle" class="nowtitle"></div><div id="nowSub" class="nowsub"></div></div><button id="playPause" class="btn small" type="button">Ⅱ</button><button id="stop" class="btn small" type="button">×</button></div><div id="overlay" class="overlay"><section class="sheet"><div class="sheethead"><div class="sheettitle">settings</div><button id="close" class="btn small" type="button">×</button></div><div class="setting"><label>navidrome</label><div class="desc">connect to your Navidrome server. the app uses the Subsonic-compatible API.</div><div class="fields"><input id="server" type="url" placeholder="https://music.example.com"><input id="user" placeholder="username"><input id="pass" type="password" placeholder="password"></div><div class="actions"><button id="connect" class="btn" type="button">connect</button><button id="reload" class="btn" type="button">reload</button></div><div id="status" class="desc" style="margin-top:9px"></div></div><div class="setting"><label>background</label><div class="actions"><button id="pickBg" class="btn" type="button">choose image</button><button id="clearBg" class="btn" type="button">reset</button></div><input id="bgFile" class="hidden" type="file" accept="image/*"></div><div class="setting"><label>font</label><div class="actions"><button id="pickFont" class="btn" type="button">import font</button><button id="clearFont" class="btn" type="button">system font</button></div><input id="fontFile" class="hidden" type="file" accept=".ttf,.otf,.woff,.woff2"></div><div class="setting"><label>background dim</label><input id="dim" type="range" min="0" max=".8" step=".02" style="width:100%"></div></section></div><script>
(()=>{'use strict';const $=s=>document.querySelector(s),A=v=>v?Array.isArray(v)?v:[v]:[],esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const q=$('#q'),songsEl=$('#songs'),listsEl=$('#playlists'),track=$('#track'),wall=$('#wall'),audio=new Audio();let page=0,songs=[],lists=[],activeList=null,activeEntries=[],playing=null;
const cfg={server:localStorage.getItem('n.server')||'',user:localStorage.getItem('n.user')||'',pass:localStorage.getItem('n.pass')||''};$('#server').value=cfg.server;$('#user').value=cfg.user;$('#pass').value=cfg.pass;
function server(){return cfg.server.trim().replace(/\/+$/,'').replace(/\/rest$/i,'')}function hex(s){return Array.from(new TextEncoder().encode(s),b=>b.toString(16).padStart(2,'0')).join('')}function url(method,extra={}){const u=new URL(server()+'/rest/'+method+'.view');u.searchParams.set('u',cfg.user);u.searchParams.set('p','enc:'+hex(cfg.pass));u.searchParams.set('v','1.16.1');u.searchParams.set('c','androidnav');u.searchParams.set('f','json');Object.entries(extra).forEach(([k,v])=>v!==undefined&&u.searchParams.append(k,v));return u.toString()}async function api(method,extra={}){const r=await fetch(url(method,extra),{cache:'no-store'});if(!r.ok)throw Error('server returned '+r.status);const j=await r.json(),x=j['subsonic-response'];if(!x||x.status!=='ok')throw Error(x?.error?.message||'Navidrome request failed');return x}function configured(){return !!(server()&&cfg.user&&cfg.pass)}function song(x){return{id:String(x.id),title:x.title||'Untitled',artist:x.artist||'Unknown artist',album:x.album||'',duration:+x.duration||0}}function time(sec){sec=Math.max(0,Math.floor(+sec||0));return Math.floor(sec/60)+':'+String(sec%60).padStart(2,'0')}
function setPage(n){page=n?1:0;track.style.transform=`translateX(-${page*50}%)`;$('#songsTab').classList.toggle('active',!page);$('#listsTab').classList.toggle('active',!!page);q.placeholder=page?'playlists':'songs';q.value='';if(page&&!lists.length&&configured())loadLists();render()}function message(t,e=false){$('#note').textContent=t||'';$('#note').style.color=e?'#ffb4b4':''}
async function loadSongs(){if(!configured()){songs=[];renderSongs();return}message('loading from navidrome…');try{const term=q.value.trim(),x=await api('search3',{query:term,songCount:500,songOffset:0,artistCount:0,albumCount:0});songs=A(x.searchResult3?.song).map(song);message(term?`${songs.length} matches`:`${songs.length} songs from navidrome`)}catch(e){songs=[];message(e.message,true)}renderSongs()}async function loadLists(){if(!configured()){lists=[];renderLists();return}try{const x=await api('getPlaylists');lists=A(x.playlists?.playlist).map(p=>({id:String(p.id),name:p.name||'Untitled playlist',count:+p.songCount||0,comment:p.comment||''}))}catch(e){message(e.message,true);lists=[]}renderLists()}async function openList(id){activeList=lists.find(x=>x.id===id)||{id,name:'playlist'};activeEntries=[];renderLists();try{const x=await api('getPlaylist',{id});activeList={...activeList,name:x.playlist?.name||activeList.name};activeEntries=A(x.playlist?.entry).map(song)}catch(e){message(e.message,true)}renderLists()}
function renderSongs(){if(!configured()){songsEl.innerHTML='<div class="empty">open settings and connect to Navidrome first.</div>';$('#songCount').textContent='';return}$('#songCount').textContent=songs.length?`${songs.length} songs`:'';songsEl.innerHTML=songs.length?songs.map(s=>`<div class="row"><button class="main play" data-id="${esc(s.id)}"><div class="rowtitle">${esc(s.title)}</div><div class="sub">${esc(s.artist)}${s.album?' · '+esc(s.album):''}${s.duration?' · '+time(s.duration):''}</div></button></div>`).join(''):'<div class="empty">no songs to show.</div>';songsEl.querySelectorAll('.play').forEach(b=>b.onclick=()=>play(b.dataset.id,songs))}function renderLists(){const term=q.value.trim().toLowerCase();if(!configured()){listsEl.innerHTML='<div class="head"><div class="title">Playlists</div></div><div class="empty">connect to Navidrome first.</div>';return}if(activeList){const rows=activeEntries.filter(s=>!term||(`${s.title} ${s.artist} ${s.album}`).toLowerCase().includes(term));listsEl.innerHTML=`<div class="detailhead"><button id="back" class="btn back">‹</button><div><div class="title">${esc(activeList.name)}</div><div class="meta" style="text-align:left">${rows.length} songs</div></div></div>${rows.map(s=>`<div class="row"><button class="main lplay" data-id="${esc(s.id)}"><div class="rowtitle">${esc(s.title)}</div><div class="sub">${esc(s.artist)}${s.album?' · '+esc(s.album):''}</div></button></div>`).join('')||'<div class="empty">this playlist is empty.</div>'}`;$('#back').onclick=()=>{activeList=null;activeEntries=[];renderLists()};listsEl.querySelectorAll('.lplay').forEach(b=>b.onclick=()=>play(b.dataset.id,activeEntries));return}const f=lists.filter(p=>!term||(`${p.name} ${p.comment}`).toLowerCase().includes(term));listsEl.innerHTML=`<div class="head"><div><div class="title">Playlists</div><div class="note">your Navidrome playlists.</div></div></div>${f.map(p=>`<div class="playlist"><button class="main open" data-id="${esc(p.id)}"><div class="playlistname">${esc(p.name)}</div><div class="sub">${p.count} songs${p.comment?' · '+esc(p.comment):''}</div></button></div>`).join('')||'<div class="empty">no playlists found.</div>'}`;listsEl.querySelectorAll('.open').forEach(b=>b.onclick=()=>openList(b.dataset.id))}function render(){renderSongs();renderLists()}
function play(id,arr){const s=arr.find(x=>String(x.id)===String(id));if(!s)return;playing=s;$('#nowTitle').textContent=s.title;$('#nowSub').textContent=[s.artist,s.album].filter(Boolean).join(' · ');$('#now').classList.add('show');audio.src=url('stream',{id:s.id});audio.play().catch(e=>message(e.message,true))}audio.onplaying=()=>$('#playPause').textContent='Ⅱ';audio.onpause=()=>$('#playPause').textContent='▶';$('#playPause').onclick=()=>audio.paused?audio.play():audio.pause();$('#stop').onclick=()=>{audio.pause();audio.removeAttribute('src');audio.load();playing=null;$('#now').classList.remove('show')};
async function connect(close=true){cfg.server=$('#server').value;cfg.user=$('#user').value.trim();cfg.pass=$('#pass').value;localStorage.setItem('n.server',cfg.server);localStorage.setItem('n.user',cfg.user);localStorage.setItem('n.pass',cfg.pass);if(!configured()){message('enter server, username, and password.',true);return}try{$('#status').textContent='connecting…';await api('ping');$('#status').textContent='connected';await Promise.all([loadSongs(),loadLists()]);if(close)$('#overlay').classList.remove('show')}catch(e){$('#status').textContent=e.message;message(e.message,true)}}
$('#settings').onclick=()=>$('#overlay').classList.add('show');$('#close').onclick=()=>$('#overlay').classList.remove('show');$('#overlay').onclick=e=>{if(e.target===$('#overlay'))$('#overlay').classList.remove('show')};$('#connect').onclick=()=>connect(true);$('#reload').onclick=()=>connect(false);$('#songsTab').onclick=()=>setPage(0);$('#listsTab').onclick=()=>setPage(1);let timer;q.oninput=()=>{clearTimeout(timer);if(page)renderLists();else timer=setTimeout(loadSongs,250)};let sx=0,sy=0;$('#viewport').ontouchstart=e=>{sx=e.changedTouches[0].clientX;sy=e.changedTouches[0].clientY};$('#viewport').ontouchend=e=>{const t=e.changedTouches[0],dx=t.clientX-sx,dy=t.clientY-sy;if(Math.abs(dx)>70&&Math.abs(dx)>Math.abs(dy)*1.3)setPage(dx<0?1:0)};
const DB='androidnav-assets';function db(){return new Promise((ok,no)=>{const r=indexedDB.open(DB,1);r.onupgradeneeded=()=>r.result.createObjectStore('a');r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)})}async function put(k,v){const d=await db();await new Promise((ok,no)=>{const t=d.transaction('a','readwrite');t.objectStore('a').put(v,k);t.oncomplete=ok;t.onerror=()=>no(t.error)});d.close()}async function get(k){const d=await db(),v=await new Promise((ok,no)=>{const t=d.transaction('a');const r=t.objectStore('a').get(k);r.onsuccess=()=>ok(r.result||null);r.onerror=()=>no(r.error)});d.close();return v}async function del(k){const d=await db();await new Promise((ok,no)=>{const t=d.transaction('a','readwrite');t.objectStore('a').delete(k);t.oncomplete=ok;t.onerror=()=>no(t.error)});d.close()}async function bg(blob){if(!blob){wall.style.backgroundImage='';wall.style.backgroundSize='';return}const u=URL.createObjectURL(blob);wall.style.backgroundImage=`url("${u}")`;wall.style.backgroundSize='cover';wall.style.backgroundPosition='center';wall.style.backgroundRepeat='no-repeat'}async function font(blob){if(!blob){document.documentElement.style.setProperty('--font','system-ui,-apple-system,"Segoe UI",sans-serif');return}try{const f=new FontFace('UserFont',blob);await f.load();document.fonts.add(f);document.documentElement.style.setProperty('--font','UserFont,system-ui,sans-serif')}catch(e){alert('could not load that font')}}$('#pickBg').onclick=()=>$('#bgFile').click();$('#bgFile').onchange=async e=>{const f=e.target.files[0];if(f){await put('bg',f);await bg(f)}};$('#clearBg').onclick=async()=>{await del('bg');await bg(null)};$('#pickFont').onclick=()=>$('#fontFile').click();$('#fontFile').onchange=async e=>{const f=e.target.files[0];if(f){await put('font',f);await font(f)}};$('#clearFont').onclick=async()=>{await del('font');await font(null)};const dim=Number(localStorage.getItem('dim')||.28);$('#dim').value=dim;document.documentElement.style.setProperty('--dim',dim);$('#dim').oninput=e=>{const v=e.target.value;document.documentElement.style.setProperty('--dim',v);localStorage.setItem('dim',v)};(async()=>{try{await bg(await get('bg'));await font(await get('font'))}catch(e){}setPage(0);if(configured())connect(false);else render()})()})();
</script></body></html>
