<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>AndroidNav</title>
<style>
:root{color-scheme:dark;--fg:#f4f4f4;--muted:rgba(255,255,255,.65);--line:rgba(255,255,255,.16);--glass:rgba(255,255,255,.035);--dim:.28;--font:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#050505;color:var(--fg);font-family:var(--font)}body{overflow-x:hidden}button,input{font:inherit;color:inherit}button{cursor:pointer}#wall{position:fixed;inset:0;z-index:0;pointer-events:none;background-color:#050505;background-image:radial-gradient(circle,rgba(255,255,255,.66) 0 1px,transparent 1.2px),radial-gradient(circle,rgba(255,255,255,.3) 0 1px,transparent 1.2px),radial-gradient(circle,rgba(255,255,255,.16) 0 .8px,transparent 1.1px);background-size:58px 58px,97px 97px,31px 31px;background-position:5px 8px,21px 39px,8px 18px;background-repeat:repeat}#wall::after{content:"";position:absolute;inset:0;background:rgba(0,0,0,var(--dim))}#app{position:relative;z-index:1;min-height:100vh;padding:calc(env(safe-area-inset-top) + 8px) 18px calc(env(safe-area-inset-bottom) + 96px)}.top{position:sticky;top:0;z-index:10;margin:0 -18px;padding:16px 18px 14px;background:rgba(255,255,255,.012);backdrop-filter:blur(22px) saturate(.85);-webkit-backdrop-filter:blur(22px) saturate(.85)}.top::after{content:"";position:absolute;left:0;right:0;bottom:-12px;height:12px;pointer-events:none;background:linear-gradient(to bottom,rgba(0,0,0,.08),transparent)}.tabs{display:flex;gap:30px;align-items:center}.tab{position:relative;border:0;background:transparent;padding:8px 0 9px;color:var(--muted);font-size:21px;text-transform:lowercase}.tab.active{color:var(--fg)}.tab.active::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;border-radius:999px;background:currentColor}.viewport{overflow:hidden}.track{display:flex;width:200%;align-items:flex-start;transition:transform .23s ease}.page{width:50%;flex:0 0 50%;min-width:0;padding:24px 0 0}.head{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;margin:0 0 18px}.title{font-size:clamp(38px,10vw,52px);line-height:.96;letter-spacing:-.055em;font-weight:560;text-shadow:0 2px 16px rgba(0,0,0,.25)}.meta,.sub,.note,.details{color:var(--muted)}.meta{padding-top:7px;font-size:15px;white-space:nowrap}.note{font-size:14px;line-height:1.45;margin-top:9px;max-width:520px}.list{display:grid;gap:0}.song-row,.playlist-row{border-bottom:1px solid rgba(255,255,255,.12)}.song-shell{padding:15px 0}.song-main,.playlist-main{display:block;width:100%;min-width:0;border:0;background:transparent;text-align:left;padding:0}.song-title,.playlist-title{font-size:25px;line-height:1.12;letter-spacing:-.03em;overflow-wrap:anywhere;word-break:break-word;text-shadow:0 2px 14px rgba(0,0,0,.25)}.song-row.expanded .song-shell{padding:18px 0 20px}.song-row.expanded .song-title{font-size:31px;line-height:1.05}.song-details{display:none;padding-top:13px}.song-row.expanded .song-details{display:block}.detail-line{font-size:15px;line-height:1.45;color:var(--muted);overflow-wrap:anywhere}.progress-wrap{margin-top:17px}.progress{width:100%;height:24px;margin:0;accent-color:#fff}.time-row{display:flex;justify-content:space-between;gap:12px;margin-top:2px;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}.expanded-controls{display:flex;gap:9px;margin-top:12px}.control-btn,.settings-link,.sheet-btn,.close-btn{border:1px solid var(--line);background:rgba(255,255,255,.035);backdrop-filter:blur(15px);-webkit-backdrop-filter:blur(15px)}.control-btn{width:48px;height:48px;border-radius:50%;font-size:21px}.playlist-row{padding:15px 0}.playlist-title{font-size:25px}.playlist-count{font-size:14px;color:var(--muted);margin-top:5px}.empty{padding:20px 0;color:var(--muted);font-size:16px;line-height:1.55}.detail-head{display:flex;gap:10px;align-items:flex-start;margin-bottom:20px}.back-btn{width:44px;height:44px;flex:0 0 auto;border:1px solid var(--line);border-radius:14px;background:var(--glass);font-size:28px;backdrop-filter:blur(15px);-webkit-backdrop-filter:blur(15px)}.settings-foot{padding:28px 0 12px;text-align:left}.settings-link{border-radius:14px;padding:10px 14px;color:var(--muted)}.now{position:fixed;z-index:12;left:16px;right:16px;bottom:calc(env(safe-area-inset-bottom) + 12px);display:none;align-items:center;gap:9px;padding:10px 9px 10px 14px;border:1px solid var(--line);border-radius:18px;background:rgba(255,255,255,.045);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);box-shadow:0 12px 34px rgba(0,0,0,.26)}.now.show{display:flex}.now-copy{flex:1;min-width:0}.now-title,.now-sub{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.now-title{font-size:17px}.now-sub{font-size:12px;color:var(--muted);margin-top:2px}.overlay{position:fixed;inset:0;z-index:30;display:none;align-items:flex-end;padding:16px;background:rgba(0,0,0,.18);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}.overlay.show{display:flex}.sheet{width:100%;max-height:88vh;overflow:auto;border:1px solid var(--line);border-radius:26px;background:rgba(255,255,255,.055);backdrop-filter:blur(26px);-webkit-backdrop-filter:blur(26px);padding:18px;box-shadow:0 16px 44px rgba(0,0,0,.3)}.sheet-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:10px}.sheet-title{font-size:29px;letter-spacing:-.04em}.close-btn{width:42px;height:42px;border-radius:50%;font-size:21px}.setting{padding:14px 0;border-top:1px solid rgba(255,255,255,.12)}.setting:first-of-type{border-top:0}.setting-name{font-size:17px;margin-bottom:6px}.setting-desc{font-size:13px;line-height:1.45;color:var(--muted);margin-bottom:10px}.fields{display:grid;gap:9px}.fields input{width:100%;min-height:48px;border:1px solid var(--line);border-radius:14px;background:var(--glass);padding:0 13px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.sheet-btn{min-height:44px;border-radius:14px;padding:9px 14px}.hidden{display:none}input[type="range"]{width:100%}.loading::after{content:"";display:inline-block;width:15px;height:15px;border:2px solid rgba(255,255,255,.22);border-top-color:#fff;border-radius:50%;margin-left:9px;vertical-align:-3px;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}@media(min-width:720px){#app{max-width:760px;margin:auto}.sheet{max-width:620px}.overlay{justify-content:center}}@media(prefers-reduced-motion:reduce){.track{transition:none}.loading::after{animation:none}}
</style>
</head>
<body>
<div id="wall" aria-hidden="true"></div>
<main id="app"><header class="top"><nav class="tabs" aria-label="Library sections"><button id="songsTab" class="tab active" type="button">songs</button><button id="playlistsTab" class="tab" type="button">playlists</button></nav></header><div id="viewport" class="viewport"><div id="track" class="track"><section class="page" aria-label="Songs"><div class="head"><div><div class="title">Songs</div><div id="note" class="note"></div></div><div id="songCount" class="meta"></div></div><div id="songs" class="list"></div></section><section class="page" aria-label="Playlists"><div id="playlists"></div></section></div></div></main>
<div id="now" class="now" aria-live="polite"><div class="now-copy"><div id="nowTitle" class="now-title"></div><div id="nowSub" class="now-sub"></div></div><button id="nowPlayPause" class="control-btn" type="button" aria-label="Play or pause">Ⅱ</button></div>
<div id="settingsOverlay" class="overlay" role="dialog" aria-modal="true" aria-label="Settings"><section class="sheet"><div class="sheet-head"><div class="sheet-title">settings</div><button id="closeSettings" class="close-btn" type="button" aria-label="Close">×</button></div><div class="setting"><div class="setting-name">navidrome</div><div class="setting-desc">connect to your Navidrome server. playback is handled by Android's native media player and MediaSession.</div><div class="fields"><input id="server" type="url" placeholder="https://music.example.com"><input id="user" type="text" placeholder="username" autocomplete="username"><input id="pass" type="password" placeholder="password" autocomplete="current-password"></div><div class="actions"><button id="connect" class="sheet-btn" type="button">connect</button><button id="reload" class="sheet-btn" type="button">reload library</button></div><div id="status" class="setting-desc" style="margin-top:9px"></div></div><div class="setting"><div class="setting-name">background</div><div class="setting-desc">pick an image for the wallpaper.</div><div class="actions"><button id="pickBg" class="sheet-btn" type="button">choose image</button><button id="clearBg" class="sheet-btn" type="button">reset</button></div><input id="bgFile" class="hidden" type="file" accept="image/*"></div><div class="setting"><div class="setting-name">background dim</div><input id="dim" type="range" min="0" max=".8" step=".02"></div></section></div>
<script>
(() => {
  'use strict';
  const $ = s => document.querySelector(s);
  const A = v => v ? (Array.isArray(v) ? v : [v]) : [];
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const songsEl = $('#songs');
  const playlistsEl = $('#playlists');
  const track = $('#track');
  const wall = $('#wall');
  const fallbackAudio = new Audio();
  const state = {page:Number(localStorage.getItem('page')||0)===1?1:0,songs:[],playlists:[],activePlaylist:null,activeEntries:[],expandedId:null,currentId:null,currentTitle:'',currentArtist:'',currentAlbum:'',playing:false,positionMs:0,durationMs:0,draggingSeek:false,backgroundUrl:null,loadingSongs:false,loadingPlaylists:false};
  const cfg = {server:localStorage.getItem('n.server')||'',user:localStorage.getItem('n.user')||'',pass:localStorage.getItem('n.pass')||''};
  $('#server').value=cfg.server;$('#user').value=cfg.user;$('#pass').value=cfg.pass;
  function server(){return cfg.server.trim().replace(/\/+$/,'').replace(/\/rest$/i,'')}
  function hex(s){return Array.from(new TextEncoder().encode(s),b=>b.toString(16).padStart(2,'0')).join('')}
  function configured(){return !!(server()&&cfg.user&&cfg.pass)}
  function formatTimeMs(ms){const sec=Math.max(0,Math.floor(Number(ms||0)/1000));return `${Math.floor(sec/60)}:${String(sec%60).padStart(2,'0')}`}
  function message(text,error=false){const el=$('#note');el.textContent=text||'';el.style.color=error?'#ffb4b4':''}
  function apiUrl(method,extra={}){const u=new URL(`${server()}/rest/${method}.view`);u.searchParams.set('u',cfg.user);u.searchParams.set('p',`enc:${hex(cfg.pass)}`);u.searchParams.set('v','1.16.1');u.searchParams.set('c','androidnav');u.searchParams.set('f','json');Object.entries(extra).forEach(([k,v])=>{if(v!==undefined&&v!==null)u.searchParams.append(k,String(v))});return u.toString()}
  function streamUrl(songId){return apiUrl('stream',{id:songId})}
  async function api(method,extra={}){const r=await fetch(apiUrl(method,extra),{cache:'no-store'});if(!r.ok)throw new Error(`server returned ${r.status}`);const j=await r.json(),x=j['subsonic-response'];if(!x||x.status!=='ok')throw new Error(x?.error?.message||'Navidrome request failed');return x}
  function song(x){return{id:String(x.id),title:x.title||'Untitled',artist:x.artist||'Unknown artist',album:x.album||'',duration:Number(x.duration||0)}}
  function setPage(n){state.page=n?1:0;localStorage.setItem('page',String(state.page));track.style.transform=`translateX(-${state.page*50}%)`;$('#songsTab').classList.toggle('active',state.page===0);$('#playlistsTab').classList.toggle('active',state.page===1);if(state.page===1&&!state.playlists.length&&configured())loadPlaylists()}
  async function loadSongs(){if(!configured()){state.songs=[];renderSongs();return}state.loadingSongs=true;message('loading from navidrome…');renderSongs();try{const x=await api('search3',{query:'',songCount:5000,songOffset:0,artistCount:0,albumCount:0});state.songs=A(x.searchResult3?.song).map(song);message(`${state.songs.length} songs from navidrome`)}catch(e){state.songs=[];message(e.message||String(e),true)}finally{state.loadingSongs=false;renderSongs()}}
  async function loadPlaylists(){if(!configured()){state.playlists=[];renderPlaylists();return}state.loadingPlaylists=true;renderPlaylists();try{const x=await api('getPlaylists');state.playlists=A(x.playlists?.playlist).map(p=>({id:String(p.id),name:p.name||'Untitled playlist',count:Number(p.songCount||0),comment:p.comment||''}))}catch(e){message(e.message||String(e),true);state.playlists=[]}finally{state.loadingPlaylists=false;renderPlaylists()}}
  async function openPlaylist(id){state.activePlaylist=state.playlists.find(p=>p.id===id)||{id,name:'playlist'};state.activeEntries=[];renderPlaylists();try{const x=await api('getPlaylist',{id});state.activePlaylist={...state.activePlaylist,name:x.playlist?.name||state.activePlaylist.name};state.activeEntries=A(x.playlist?.entry).map(song)}catch(e){message(e.message||String(e),true)}renderPlaylists()}
  function findSong(id){return state.songs.find(s=>s.id===String(id))||state.activeEntries.find(s=>s.id===String(id))||null}
  function playerAvailable(){return typeof window.AndroidPlayer!=='undefined'&&window.AndroidPlayer&&typeof window.AndroidPlayer.play==='function'}
  function startSong(s){if(!s||!configured())return;state.expandedId=s.id;state.currentId=s.id;state.currentTitle=s.title;state.currentArtist=s.artist;state.currentAlbum=s.album;state.durationMs=Math.max(0,s.duration*1000);state.positionMs=0;state.playing=true;renderSongs();renderPlaylists();updateNow();if(playerAvailable())window.AndroidPlayer.play(streamUrl(s.id),s.id,s.title,s.artist,s.album,Math.max(0,Math.floor(s.duration)));else{fallbackAudio.src=streamUrl(s.id);fallbackAudio.play().catch(e=>message(e.message||String(e),true))}}
  function togglePlayback(){if(playerAvailable())window.AndroidPlayer.toggle();else if(!fallbackAudio.paused)fallbackAudio.pause();else fallbackAudio.play().catch(()=>{})}
  function seekTo(ms){const value=Math.max(0,Math.round(ms));if(playerAvailable())window.AndroidPlayer.seekTo(value);else fallbackAudio.currentTime=value/1000;state.positionMs=value;updateProgressDom()}
  function detailsMarkup(s){const durationMs=Math.max(state.durationMs||s.duration*1000,1),positionMs=state.currentId===s.id?Math.min(state.positionMs,durationMs):0;return `<div class="song-details"><div class="detail-line">${esc(s.artist)}${s.album?` · ${esc(s.album)}`:''}</div><div class="progress-wrap"><input class="progress seek" type="range" min="0" max="${Math.max(1,Math.round(durationMs))}" value="${Math.max(0,Math.round(positionMs))}" data-song="${esc(s.id)}" aria-label="Song position"><div class="time-row"><span class="elapsed" data-time-song="${esc(s.id)}">${formatTimeMs(positionMs)}</span><span class="total" data-total-song="${esc(s.id)}">${formatTimeMs(durationMs)}</span></div></div><div class="expanded-controls"><button class="control-btn expanded-toggle" type="button" data-song="${esc(s.id)}" aria-label="Play or pause">${state.playing&&state.currentId===s.id?'Ⅱ':'▶'}</button></div></div>`}
  function bindSongRows(root,collection){root.querySelectorAll('.song-main').forEach(btn=>btn.addEventListener('click',()=>{const s=collection.find(x=>x.id===btn.dataset.song)||findSong(btn.dataset.song);if(!s)return;if(state.currentId===s.id){state.expandedId=s.id;renderSongs();renderPlaylists()}else startSong(s)}));root.querySelectorAll('.expanded-toggle').forEach(btn=>btn.addEventListener('click',e=>{e.stopPropagation();const s=collection.find(x=>x.id===btn.dataset.song)||findSong(btn.dataset.song);if(!s)return;if(state.currentId!==s.id)startSong(s);else togglePlayback()}));root.querySelectorAll('.seek').forEach(slider=>{slider.addEventListener('pointerdown',()=>{state.draggingSeek=true});slider.addEventListener('touchstart',()=>{state.draggingSeek=true},{passive:true});slider.addEventListener('input',()=>{state.draggingSeek=true;const elapsed=root.querySelector(`[data-time-song="${CSS.escape(slider.dataset.song)}"]`);if(elapsed)elapsed.textContent=formatTimeMs(Number(slider.value))});const commit=()=>{seekTo(Number(slider.value));state.draggingSeek=false};slider.addEventListener('change',commit);slider.addEventListener('pointerup',()=>{if(state.draggingSeek)commit()})})}
  function renderSongs(){$('#songCount').textContent=state.songs.length?`${state.songs.length} songs`:'';if(!configured()){songsEl.innerHTML='<div class="empty">connect to Navidrome from the settings link at the bottom of the playlists tab.</div>';return}if(state.loadingSongs){songsEl.innerHTML='<div class="empty loading">loading songs</div>';return}if(!state.songs.length){songsEl.innerHTML='<div class="empty">no songs to show.</div>';return}songsEl.innerHTML=state.songs.map(s=>`<div class="song-row ${state.expandedId===s.id?'expanded':''}" data-row-song="${esc(s.id)}"><div class="song-shell"><button class="song-main" type="button" data-song="${esc(s.id)}"><div class="song-title">${esc(s.title)}</div></button>${state.expandedId===s.id?detailsMarkup(s):''}</div></div>`).join('');bindSongRows(songsEl,state.songs)}
  function renderPlaylists(){if(!configured()){playlistsEl.innerHTML=`<div class="head"><div class="title">Playlists</div></div><div class="empty">connect to Navidrome in settings.</div><div class="settings-foot"><button class="settings-link open-settings" type="button">settings</button></div>`;bindSettingsLinks();return}if(state.activePlaylist){const rows=state.activeEntries;playlistsEl.innerHTML=`<div class="detail-head"><button id="playlistBack" class="back-btn" type="button" aria-label="Back">‹</button><div style="min-width:0"><div class="title">${esc(state.activePlaylist.name)}</div><div class="meta" style="padding-top:7px;text-align:left">${rows.length} songs</div></div></div><div id="playlistSongs" class="list">${rows.length?rows.map(s=>`<div class="song-row ${state.expandedId===s.id?'expanded':''}" data-row-song="${esc(s.id)}"><div class="song-shell"><button class="song-main" type="button" data-song="${esc(s.id)}"><div class="song-title">${esc(s.title)}</div></button>${state.expandedId===s.id?detailsMarkup(s):''}</div></div>`).join(''):'<div class="empty">this playlist is empty.</div>'}</div><div class="settings-foot"><button class="settings-link open-settings" type="button">settings</button></div>`;$('#playlistBack').addEventListener('click',()=>{state.activePlaylist=null;state.activeEntries=[];renderPlaylists()});bindSongRows($('#playlistSongs'),state.activeEntries);bindSettingsLinks();return}playlistsEl.innerHTML=`<div class="head"><div><div class="title">Playlists</div><div class="note">your Navidrome playlists.</div></div></div>${state.loadingPlaylists?'<div class="empty loading">loading playlists</div>':(state.playlists.length?state.playlists.map(p=>`<div class="playlist-row"><button class="playlist-main" type="button" data-playlist="${esc(p.id)}"><div class="playlist-title">${esc(p.name)}</div><div class="playlist-count">${p.count} songs</div></button></div>`).join(''):'<div class="empty">no playlists found.</div>')}<div class="settings-foot"><button class="settings-link open-settings" type="button">settings</button></div>`;playlistsEl.querySelectorAll('.playlist-main').forEach(btn=>btn.addEventListener('click',()=>openPlaylist(btn.dataset.playlist)));bindSettingsLinks()}
  function bindSettingsLinks(){document.querySelectorAll('.open-settings').forEach(btn=>btn.addEventListener('click',()=>$('#settingsOverlay').classList.add('show')))}
  function updateNow(){if(!state.currentId){$('#now').classList.remove('show');return}$('#nowTitle').textContent=state.currentTitle;$('#nowSub').textContent=[state.currentArtist,state.currentAlbum].filter(Boolean).join(' · ');$('#nowPlayPause').textContent=state.playing?'Ⅱ':'▶';$('#now').classList.add('show')}
  function updateProgressDom(){if(!state.currentId)return;if(!state.draggingSeek){document.querySelectorAll(`.seek[data-song="${CSS.escape(state.currentId)}"]`).forEach(slider=>{slider.max=String(Math.max(1,state.durationMs));slider.value=String(Math.min(state.positionMs,Math.max(1,state.durationMs)))});document.querySelectorAll(`[data-time-song="${CSS.escape(state.currentId)}"]`).forEach(el=>el.textContent=formatTimeMs(state.positionMs))}document.querySelectorAll(`[data-total-song="${CSS.escape(state.currentId)}"]`).forEach(el=>el.textContent=formatTimeMs(state.durationMs));document.querySelectorAll('.expanded-toggle').forEach(btn=>{if(btn.dataset.song===state.currentId)btn.textContent=state.playing?'Ⅱ':'▶'});updateNow()}
  function pollNativePlayer(){if(!playerAvailable())return;try{const raw=window.AndroidPlayer.getState();if(!raw)return;const p=JSON.parse(raw);if(p.id){const idChanged=state.currentId!==String(p.id);state.currentId=String(p.id);state.currentTitle=p.title||state.currentTitle;state.currentArtist=p.artist||state.currentArtist;state.currentAlbum=p.album||state.currentAlbum;state.positionMs=Number(p.positionMs||0);state.durationMs=Number(p.durationMs||state.durationMs||0);state.playing=!!p.playing;if(idChanged){state.expandedId=state.currentId;renderSongs();renderPlaylists()}updateProgressDom()}}catch(_){}}
  fallbackAudio.addEventListener('timeupdate',()=>{state.positionMs=fallbackAudio.currentTime*1000;state.durationMs=Number.isFinite(fallbackAudio.duration)?fallbackAudio.duration*1000:state.durationMs;updateProgressDom()});fallbackAudio.addEventListener('play',()=>{state.playing=true;updateProgressDom()});fallbackAudio.addEventListener('pause',()=>{state.playing=false;updateProgressDom()});
  const DB_NAME='androidnav-assets';function openDb(){return new Promise((resolve,reject)=>{const req=indexedDB.open(DB_NAME,1);req.onupgradeneeded=()=>req.result.createObjectStore('assets');req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)})}async function putAsset(key,blob){const db=await openDb();await new Promise((resolve,reject)=>{const tx=db.transaction('assets','readwrite');tx.objectStore('assets').put(blob,key);tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)});db.close()}async function getAsset(key){const db=await openDb();const value=await new Promise((resolve,reject)=>{const tx=db.transaction('assets','readonly'),req=tx.objectStore('assets').get(key);req.onsuccess=()=>resolve(req.result||null);req.onerror=()=>reject(req.error)});db.close();return value}async function deleteAsset(key){const db=await openDb();await new Promise((resolve,reject)=>{const tx=db.transaction('assets','readwrite');tx.objectStore('assets').delete(key);tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)});db.close()}
  async function applyBackground(blob){if(state.backgroundUrl)URL.revokeObjectURL(state.backgroundUrl);state.backgroundUrl=blob?URL.createObjectURL(blob):null;if(blob){wall.style.backgroundImage=`url("${state.backgroundUrl}")`;wall.style.backgroundSize='cover';wall.style.backgroundPosition='center';wall.style.backgroundRepeat='no-repeat'}else{wall.style.backgroundImage='';wall.style.backgroundSize='';wall.style.backgroundPosition='';wall.style.backgroundRepeat=''}}
  async function restoreAppearance(){const dim=Math.min(.8,Math.max(0,Number(localStorage.getItem('bgDim')||.28)));document.documentElement.style.setProperty('--dim',dim);$('#dim').value=String(dim);try{await applyBackground(await getAsset('background'))}catch(_){}}
  async function connectAndLoad(closeAfter=true){cfg.server=$('#server').value.trim();cfg.user=$('#user').value.trim();cfg.pass=$('#pass').value;localStorage.setItem('n.server',cfg.server);localStorage.setItem('n.user',cfg.user);localStorage.setItem('n.pass',cfg.pass);if(!configured()){$('#status').textContent='enter server, username, and password.';return}$('#connect').classList.add('loading');try{await api('ping');$('#status').textContent='connected';await Promise.all([loadSongs(),loadPlaylists()]);if(closeAfter)$('#settingsOverlay').classList.remove('show')}catch(e){$('#status').textContent=e.message||String(e);message(e.message||String(e),true)}finally{$('#connect').classList.remove('loading')}}
  $('#songsTab').addEventListener('click',()=>setPage(0));$('#playlistsTab').addEventListener('click',()=>setPage(1));let touchX=0,touchY=0;$('#viewport').addEventListener('touchstart',e=>{const t=e.changedTouches[0];touchX=t.clientX;touchY=t.clientY},{passive:true});$('#viewport').addEventListener('touchend',e=>{const t=e.changedTouches[0],dx=t.clientX-touchX,dy=t.clientY-touchY;if(Math.abs(dx)>70&&Math.abs(dx)>Math.abs(dy)*1.3)setPage(dx<0?1:0)},{passive:true});$('#closeSettings').addEventListener('click',()=>$('#settingsOverlay').classList.remove('show'));$('#settingsOverlay').addEventListener('click',e=>{if(e.target===$('#settingsOverlay'))$('#settingsOverlay').classList.remove('show')});$('#connect').addEventListener('click',()=>connectAndLoad(true));$('#reload').addEventListener('click',()=>connectAndLoad(false));$('#pickBg').addEventListener('click',()=>$('#bgFile').click());$('#bgFile').addEventListener('change',async e=>{const file=e.target.files?.[0];if(!file)return;await putAsset('background',file);await applyBackground(file);e.target.value=''});$('#clearBg').addEventListener('click',async()=>{await deleteAsset('background');await applyBackground(null)});$('#dim').addEventListener('input',e=>{const v=Math.min(.8,Math.max(0,Number(e.target.value)||0));document.documentElement.style.setProperty('--dim',v);localStorage.setItem('bgDim',String(v))});$('#nowPlayPause').addEventListener('click',togglePlayback);
  restoreAppearance();setPage(state.page);renderSongs();renderPlaylists();if(configured())Promise.all([loadSongs(),loadPlaylists()]);setInterval(pollNativePlayer,300);
})();
</script>
</body>
