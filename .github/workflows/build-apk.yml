name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Restore persistent debug signing key
        run: base64 --decode signing/androidnav-debug.keystore.b64 > signing/androidnav-debug.keystore

      - name: Check embedded JavaScript syntax
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          html = Path('app/src/main/assets/index.html').read_text()
          script = re.search(r'<script>(.*?)</script>', html, re.S)
          if script is None:
              raise SystemExit('embedded JavaScript missing')
          Path('/tmp/androidnav-ui.js').write_text(script.group(1))
          assert 'position:sticky' not in html, 'sticky tab header remains'
          assert 'androidPlaybackStateChanged' in html, 'player update hook missing'
          assert 'id="goPlaylists"' not in html, 'old top playlists link remains'
          assert 'NOW PLAYING</div>' not in html, 'old mini player caption remains'
          assert '.song-details{display:none;margin:4px 0 17px 38px;padding:9px 6px 14px 2px;border:0' in html, 'inline player background not removed'
          assert 'class="head songs-head"' in html, 'songs header missing'
          assert '.songs-head{display:flex;flex-direction:row;align-items:baseline;justify-content:space-between' in html, 'track count not right-aligned with heading'
          assert "id=\"pickFont\"" in html and "id=\"clearFont\"" in html, 'font chooser buttons missing'
          assert 'window.androidFontChanged' in html and 'getFontDataUrl()' in html, 'font integration missing'
          native = Path('app/src/main/java/com/johndsdev/androidnav/MainActivity.java').read_text()
          assert 'reportTelemetry(false)' in native and 'reportTelemetry(true)' in native, 'scrobble reporting missing'
          assert 'recordPlaybackProgress()' in native and 'SystemClock.elapsedRealtime()' in native, 'listening-time measurement missing'
          assert 'appendQueryParameter("id", songId)' in native, 'scrobble song id missing'
          assert 'clearQuery()' in native, 'scrobble uses stream query without filtering'
          assert 'now - telemetryLastNowPlayingMs >= 30000' in native, 'now playing heartbeat missing'
          assert 'getTelemetryStatus()' in native and 'testNowPlaying()' in native, 'telemetry debug API missing'
          assert 'id="telemetryStatus"' in html and 'id="testNowPlaying"' in html, 'telemetry debug controls missing'
          assert 'ACTION_OPEN_DOCUMENT' in native and 'REQ_FONT' in native, 'font picker missing'
          PY
          node --check /tmp/androidnav-ui.js

      - name: Build APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Verify APK signature
        run: $ANDROID_HOME/build-tools/35.0.0/apksigner verify --verbose app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AndroidNav-v2.6.1-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Verify APK installation and launch in Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_4
          disable-animations: true
          script: |
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell am start -W -n com.johndsdev.androidnav.navidrome/com.johndsdev.androidnav.MainActivity
            sleep 8
            adb shell pidof com.johndsdev.androidnav.navidrome
            adb shell dumpsys activity activities | grep -q com.johndsdev.androidnav
